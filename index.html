<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stimmen-Effekte">
<meta name="theme-color" content="#150f0c">
<title>Stimmen-Effekte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#150f0c;--panel:#221812;--line:#3b2a1f;--fg:#f7ead6;--muted:#b09a85;--accent:#ffb020;--accent-ink:#1d1206;--hot:#ff4d6d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-width:560px;margin-inline:auto}
h1{font-family:Bungee,"Arial Black",sans-serif;font-weight:400;font-size:26px;margin:4px 0 2px;color:var(--accent);text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 16px Inter,system-ui,sans-serif;cursor:pointer;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.live-on{background:var(--hot);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.field{margin:12px 0}
.field.off{opacity:.4}
.field label{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:4px}
.field output{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
#status{min-height:1.4em;color:var(--muted);margin:10px 0 0;font-size:14px}
audio{width:100%;margin-top:10px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.warn{color:var(--accent);font-size:13px;margin:8px 0 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<h1>Stimmen-Effekte</h1>
<p class="sub">Hall, Echo, Roboter und mehr für deine Stimme.</p>

<section class="card">
  <h2>1. Live-Mikrofon</h2>
  <button class="btn" id="live">Mikrofon starten</button>
  <p class="warn">Mit Kopfhörern benutzen, sonst kann es pfeifen.</p>
  <p class="hint">Tonhöhe funktioniert nur bei Aufnahmedateien.</p>
</section>

<section class="card">
  <h2>2. Oder Aufnahme wählen</h2>
  <label class="btn ghost" for="file">Audiodatei wählen</label>
  <input id="file" class="vh" type="file" accept="audio/*">
  <div class="row" style="margin-top:10px"><button class="btn" id="play" disabled>Effekt abspielen</button><button class="btn ghost" id="orig" disabled>Original</button></div>
  <audio id="player" controls></audio>
</section>

<p id="status" role="status" aria-live="polite">Bereit.</p>

<section class="card">
  <h2>3. Vorlagen</h2>
  <div class="chips" id="presets"></div>
</section>

<section class="card">
  <h2>4. Feineinstellung</h2>
  <div id="sliders"></div>
</section>

<script>
const SLIDERS=[
 {id:'pitch',label:'Tonhöhe',unit:' Halbtöne',min:-12,max:12,step:1,def:0,fileOnly:true},
 {id:'reverb',label:'Hall',unit:' %',min:0,max:100,step:1,def:0},
 {id:'echo',label:'Echo-Anteil',unit:' %',min:0,max:100,step:1,def:0},
 {id:'echoTime',label:'Echo-Zeit',unit:' ms',min:50,max:1000,step:10,def:300},
 {id:'echoFb',label:'Echo-Nachklang',unit:' %',min:0,max:90,step:1,def:40},
 {id:'chorus',label:'Chor / Schwebung',unit:' %',min:0,max:100,step:1,def:0},
 {id:'dist',label:'Verzerrung',unit:' %',min:0,max:100,step:1,def:0},
 {id:'robot',label:'Roboter (Ringmodulation)',unit:' Hz',min:0,max:300,step:1,def:0},
 {id:'lp',label:'Tiefpass (dumpfer)',unit:' Hz',min:300,max:20000,step:50,def:20000},
 {id:'vol',label:'Lautstärke',unit:' %',min:0,max:200,step:1,def:100}
];
const DEFAULTS=Object.fromEntries(SLIDERS.map(s=>[s.id,s.def]));
const PRESETS={
 original:{},
 geister:{pitch:-2,reverb:70,echo:40,echoTime:350,echoFb:50,chorus:30,lp:5000},
 kapitan:{pitch:-5,reverb:20,dist:30,lp:3000,vol:120},
 roboter:{robot:45,reverb:10,dist:10,lp:8000},
 riesenrad:{reverb:40,echo:60,echoTime:500,echoFb:60},
 clown:{pitch:7,chorus:60,echo:20,echoTime:150,lp:14000},
 megafon:{lp:1500,dist:60,reverb:5,vol:150}
};
const PRESET_NAMES={original:'Original',geister:'Geisterbahn',kapitan:'Kapitän',roboter:'Roboter',riesenrad:'Riesenrad-Echo',clown:'Clown',megafon:'Megafon'};

let cur={...DEFAULTS};
let srcBuf=null, busy=false, lastUrl=null;
let live=null; // {ctx, stream, N}
const $=id=>document.getElementById(id);
const setStatus=t=>{$('status').textContent=t;};

function show(s){$('o-'+s.id).textContent=cur[s.id]+s.unit;}
function markPreset(k){document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===k)));}
function syncSliders(){
 SLIDERS.forEach(s=>{$('s-'+s.id).value=cur[s.id];show(s);});
}

function buildUI(){
 const sl=$('sliders');
 SLIDERS.forEach(s=>{
  const w=document.createElement('div');
  w.className='field';
  w.id='f-'+s.id;
  w.innerHTML=`<label for="s-${s.id}">${s.label}<output id="o-${s.id}"></output></label><input type="range" id="s-${s.id}" min="${s.min}" max="${s.max}" step="${s.step}">`;
  sl.appendChild(w);
  const inp=w.querySelector('input');
  inp.value=cur[s.id];
  inp.addEventListener('input',()=>{
   cur[s.id]=Number(inp.value);show(s);markPreset(null);
   if(live) applyParams(live.N,live.ctx,cur,true);
  });
  show(s);
 });
 const pc=$('presets');
 Object.keys(PRESETS).forEach(k=>{
  const b=document.createElement('button');
  b.className='chip';b.dataset.preset=k;b.textContent=PRESET_NAMES[k];
  b.addEventListener('click',()=>{
   cur={...DEFAULTS,...PRESETS[k]};
   syncSliders();markPreset(k);
   if(live) applyParams(live.N,live.ctx,cur,true);
  });
  pc.appendChild(b);
 });
 markPreset('original');
 updatePitchState();
}
function updatePitchState(){
 SLIDERS.filter(s=>s.fileOnly).forEach(s=>{
  const on=!live; // Tonhöhe nur bei Aufnahmedateien
  $('f-'+s.id).classList.toggle('off',!on);
  $('s-'+s.id).disabled=!on;
 });
}

function distCurve(a){
 const n=2048,c=new Float32Array(n),k=a*60;
 for(let i=0;i<n;i++){
  const x=i*2/(n-1)-1;
  c[i]=k===0?x:((3+k)*x*20*Math.PI/180)/(Math.PI+k*Math.abs(x));
 }
 return c;
}
function impulse(ctx,secs){
 const len=Math.floor(ctx.sampleRate*secs);
 const buf=ctx.createBuffer(2,len,ctx.sampleRate);
 for(let ch=0;ch<2;ch++){
  const d=buf.getChannelData(ch);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
 }
 return buf;
}

// Effektkette: wird für Live (Mikrofon) und Datei (offline) gleich aufgebaut
function buildChain(ctx,input,dest){
 const N={};
 N.master=ctx.createGain(); N.master.connect(dest);
 N.lp=ctx.createBiquadFilter(); N.lp.type='lowpass'; N.lp.Q.value=0.7;
 N.shaper=ctx.createWaveShaper(); N.shaper.oversample='4x';
 N.pre=ctx.createGain();
 input.connect(N.lp); N.lp.connect(N.shaper); N.shaper.connect(N.pre);
 N.dry=ctx.createGain(); N.pre.connect(N.dry); N.dry.connect(N.master);
 N.d=ctx.createDelay(2); N.fb=ctx.createGain(); N.ewet=ctx.createGain();
 N.pre.connect(N.d); N.d.connect(N.fb); N.fb.connect(N.d); N.d.connect(N.ewet); N.ewet.connect(N.master);
 N.conv=ctx.createConvolver(); N.conv.buffer=impulse(ctx,2.8);
 N.rwet=ctx.createGain(); N.pre.connect(N.conv); N.conv.connect(N.rwet); N.rwet.connect(N.master);
 N.cd=ctx.createDelay(0.1); N.cd.delayTime.value=0.018;
 N.lfo=ctx.createOscillator(); N.lfo.frequency.value=0.7;
 N.lfoG=ctx.createGain(); N.lfo.connect(N.lfoG); N.lfoG.connect(N.cd.delayTime);
 N.cwet=ctx.createGain(); N.pre.connect(N.cd); N.cd.connect(N.cwet); N.cwet.connect(N.master);
 N.ring=ctx.createGain(); N.ring.gain.value=0;
 N.osc=ctx.createOscillator(); N.osc.connect(N.ring.gain);
 N.rmix=ctx.createGain(); N.pre.connect(N.ring); N.ring.connect(N.rmix); N.rmix.connect(N.master);
 N.lfo.start(0); N.osc.start(0);
 return N;
}
function applyParams(N,ctx,p,smooth){
 const set=(param,v)=>{ if(smooth) param.setTargetAtTime(v,ctx.currentTime,0.03); else param.value=v; };
 set(N.master.gain,p.vol/100);
 set(N.lp.frequency,p.lp);
 N.shaper.curve=distCurve(p.dist/100);
 set(N.dry.gain,p.robot>0?0.25:1);
 set(N.d.delayTime,p.echoTime/1000);
 set(N.fb.gain,p.echoFb/100);
 set(N.ewet.gain,p.echo/100);
 set(N.rwet.gain,p.reverb/100);
 set(N.lfoG.gain,0.006*(p.chorus/100));
 set(N.cwet.gain,p.chorus>0?0.8:0);
 set(N.osc.frequency,p.robot);
 set(N.rmix.gain,p.robot>0?1:0);
}

// ---- Live-Mikrofon ----
async function startLive(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  setStatus('Dein Browser unterstützt kein Mikrofon hier. Bitte Safari oder Chrome nutzen.');return;
 }
 try{
  setStatus('Mikrofon wird gestartet …');
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  await ctx.resume();
  const srcNode=ctx.createMediaStreamSource(stream);
  const N=buildChain(ctx,srcNode,ctx.destination);
  applyParams(N,ctx,cur,false);
  live={ctx,stream,N};
  $('live').textContent='Mikrofon stoppen';
  $('live').classList.add('live-on');
  setStatus('Live: Sprich ins Mikrofon. Effekte kannst du jetzt verändern.');
  updatePitchState();
 }catch(err){
  setStatus('Mikrofon nicht erlaubt. Erlaube den Zugriff in der Browser-Abfrage und versuche es erneut.');
 }
}
function stopLive(){
 if(!live) return;
 live.stream.getTracks().forEach(t=>t.stop());
 live.ctx.close();
 live=null;
 $('live').textContent='Mikrofon starten';
 $('live').classList.remove('live-on');
 setStatus('Mikrofon gestoppt.');
 updatePitchState();
}
$('live').addEventListener('click',()=>{ live?stopLive():startLive(); });

// ---- Aufnahme-Datei (offline) ----
async function renderFx(buf,p){
 const rate=Math.pow(2,p.pitch/12);
 const sr=buf.sampleRate, tail=3.5;
 const len=Math.ceil((buf.duration/rate+tail)*sr);
 const ctx=new OfflineAudioContext(2,len,sr);
 const src=ctx.createBufferSource(); src.buffer=buf; src.playbackRate.value=rate;
 const N=buildChain(ctx,src,ctx.destination);
 applyParams(N,ctx,p,false);
 src.start(0);
 const out=await ctx.startRendering();
 let peak=0;
 const chans=[0,1].map(i=>out.getChannelData(i));
 chans.forEach(c=>{for(let i=0;i<c.length;i++){const a=Math.abs(c[i]); if(a>peak) peak=a;}});
 if(peak>0.98){const g=0.95/peak; chans.forEach(c=>{for(let i=0;i<c.length;i++) c[i]*=g;});}
 return out;
}
function toWav(buf){
 const ch=buf.numberOfChannels,sr=buf.sampleRate,n=buf.length;
 const dv=new DataView(new ArrayBuffer(44+n*ch*2));
 const w=(o,s)=>{for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i));};
 w(0,'RIFF'); dv.setUint32(4,36+n*ch*2,true); w(8,'WAVE'); w(12,'fmt ');
 dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,ch,true);
 dv.setUint32(24,sr,true); dv.setUint32(28,sr*ch*2,true);
 dv.setUint16(32,ch*2,true); dv.setUint16(34,16,true);
 w(36,'data'); dv.setUint32(40,n*ch*2,true);
 const chans=[]; for(let i=0;i<ch;i++) chans.push(buf.getChannelData(i));
 let off=44;
 for(let i=0;i<n;i++) for(let c=0;c<ch;c++){
  const s=Math.max(-1,Math.min(1,chans[c][i]));
  dv.setInt16(off,s<0?s*0x8000:s*0x7fff,true); off+=2;
 }
 return new Blob([dv],{type:'audio/wav'});
}
async function playBuf(b){
 const url=URL.createObjectURL(toWav(b));
 if(lastUrl) URL.revokeObjectURL(lastUrl);
 lastUrl=url;
 const pl=$('player'); pl.src=url;
 try{await pl.play();}catch(e){}
}
$('file').addEventListener('change',async e=>{
 const f=e.target.files[0]; if(!f) return;
 setStatus('Aufnahme wird geladen …');
 $('play').disabled=true; $('orig').disabled=true;
 try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  srcBuf=await ctx.decodeAudioData(await f.arrayBuffer());
  ctx.close();
  setStatus(`Geladen: ${f.name} (${Math.round(srcBuf.duration)} s).`);
  $('play').disabled=false; $('orig').disabled=false;
 }catch(err){
  srcBuf=null;
  setStatus('Diese Datei kann nicht gelesen werden. Bitte eine Audiodatei wählen.');
 }
});
$('play').addEventListener('click',async()=>{
 if(!srcBuf||busy) return;
 busy=true; setStatus('Effekt wird berechnet …');
 try{
  const out=await renderFx(srcBuf,{...cur});
  setStatus('Fertig.');
  await playBuf(out);
 }catch(err){ setStatus('Der Effekt konnte nicht berechnet werden.'); }
 busy=false;
});
$('orig').addEventListener('click',()=>{ if(srcBuf) playBuf(srcBuf); });

buildUI();
</script>
</body>
</html>
